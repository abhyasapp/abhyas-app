name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check (every first-party .js)
        run: npm run check-syntax
      - name: Lint
        run: npm run lint
      - name: Unit + integrity tests
        run: npm test
      - name: Button audit (every button wired, no dead handlers)
        run: npm run audit:buttons
